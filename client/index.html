<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Mudlay — Wear Your Everyday</title>
    <meta
      name="description"
      content="Discover Mudlay's everyday fashion essentials. Explore modern styles designed for comfort, confidence, and effortless everyday wear."
    />
    <meta
      name="keywords"
      content="Mudlay, fashion, everyday wear, clothing, fashion essentials, online fashion store"
    />
    <meta name="author" content="Mudlay" />
    <meta name="application-name" content="Mudlay" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://mudlay.netlify.app/"
    />

    <!-- Mudlay brand theme -->
    <meta name="theme-color" content="#f8f5ef" />
    <meta name="color-scheme" content="light" />
    <meta name="background-color" content="#f8f5ef" />
    <meta name="msapplication-TileColor" content="#263c2c" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph: WhatsApp, Facebook, Telegram and other previews -->
    <meta property="og:site_name" content="Mudlay" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://mudlay.netlify.app/"
    />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="Mudlay — Wear Your Everyday"
    />
    <meta
      property="og:description"
      content="Everyday fashion, thoughtfully styled. Discover your next favourite look with Mudlay."
    />
    <meta
      property="og:image"
      content="https://mudlay.netlify.app/og-image.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://mudlay.netlify.app/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mudlay — Wear Your Everyday, premium everyday fashion in forest green and warm cream."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Mudlay — Wear Your Everyday"
    />
    <meta
      name="twitter:description"
      content="Everyday fashion, thoughtfully styled. Discover your next favourite look with Mudlay."
    />
    <meta
      name="twitter:image"
      content="https://mudlay.netlify.app/og-image.png"
    />
    <meta
      name="twitter:image:alt"
      content="Mudlay everyday fashion"
    />

    <!-- Favicons and app icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Optional Google Search Console verification -->
    <!--
    <meta
      name="google-site-verification"
      content="YOUR_VERIFICATION_CODE"
    />
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
